name: Publish VALERIAN V20 and V21 mobile previews
on:
  push:
    branches:
      - work/v20-cleanup-baseline
      - work/v20-single-document-integration
      - v21/mobile-app-release
    paths:
      - 'index.html'
      - 'engine-runtime.js'
      - 'engine.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'scripts/**'
      - 'styles/tailwind.audit.css'
      - 'tailwind.audit.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-v20-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: valerian-shared-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V20 cleanup preview source
        uses: actions/checkout@v4
        with:
          ref: work/v20-cleanup-baseline
          path: v20-src
      - name: Checkout V21 mobile source
        uses: actions/checkout@v4
        with:
          ref: v21/mobile-app-release
          path: v21-src
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build V20 with offline CSS completion
        run: |
          cd v20-src
          npm install --no-audit --no-fund
          npm run build:web
          npm run build:css-audit
          npm run build:css-completion
      - name: Build V21 web bundle
        run: |
          cd v21-src
          npm install --no-audit --no-fund
          npm run build:web
      - name: Assemble V20 root and isolated V21 preview path
        run: |
          mkdir -p site/v21
          cp -a v20-src/www/. site/
          cp -a v21-src/www/. site/v21/
      - name: Isolate V21 preview cache and identify preview build
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = 'v21-preview-' + process.env.BUILD_SHA.slice(0, 12);
          const workerPath = 'site/v21/service-worker.js';
          let worker = fs.readFileSync(workerPath, 'utf8');
          worker = worker.replaceAll('valerian-app-shell-', 'valerian-v21-preview-shell-');
          worker = worker.replaceAll('v20-20261119-0607', version);
          fs.writeFileSync(workerPath, worker);
          const indexPath = 'site/v21/index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replaceAll('v20-20261119-0607', version);
          html = html.replace(/<title>[^<]*<\/title>/, '<title>VALERIAN V21 Mobile Preview</title>');
          html = html.replace(/<meta name="app-version" content="[^"]*">/, '<meta name="app-version" content="V21 Mobile Preview">');
          fs.writeFileSync(indexPath, html);
          console.log('V21 preview cache isolated as ' + version);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy combined V20 and V21 previews
        id: deployment
        uses: actions/deploy-pages@v4
