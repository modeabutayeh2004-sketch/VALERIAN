name: VALERIAN Mobile Architecture Audit
on:
  push:
    branches:
      - v21/mobile-app-release
  pull_request:
    branches:
      - v21/mobile-app-release
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web build dependency
        run: npm install
      - name: Prepare mobile web bundle
        run: npm run build:web
      - name: Audit source and prepared bundle
        run: npm run audit:mobile
