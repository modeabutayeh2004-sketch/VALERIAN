name: VALERIAN Mobile Architecture Audit
on:
  push:
    branches:
      - v21/mobile-app-release
  pull_request:
    branches:
      - v21/mobile-app-release
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web build dependency
        run: npm install
      - name: Report dependency security advisories
        run: |
          npm audit --json > /tmp/valerian-npm-audit.json || true
          node -e 'const a=require("/tmp/valerian-npm-audit.json"); const rows=Object.entries(a.vulnerabilities||{}); console.log("npm audit: "+rows.length+" vulnerable packages"); rows.forEach(([name,v])=>{console.log(name+" | "+v.severity+" | "+v.range); (v.via||[]).forEach(x=>{if(typeof x==="object") console.log("  "+x.title+" | "+(x.url||""));});});'
      - name: Prepare mobile web bundle
        run: npm run build:web
      - name: Audit source and prepared bundle
        run: npm run audit:mobile
      - name: Install isolated browser-test tooling
        run: npm install --no-save playwright@1.56.1
      - name: Install headless Chromium
        run: npx --yes playwright@1.56.1 install chromium
      - name: Verify mobile import and local persistence in a browser
        run: node tests/mobile-import-smoke.mjs
      - name: Verify mobile sales, returns, refunds, and persistence in a browser
        run: node tests/mobile-sales-returns-smoke.mjs
      - name: Verify offline app shell and local styles in a browser
        run: node tests/mobile-offline-smoke.mjs
      - name: Verify decant production, supplies, and supplier ledger in a browser
        run: node tests/mobile-inventory-smoke.mjs
      - name: Verify reservation, shipping, and delivery in a browser
        run: node tests/mobile-reservation-shipping-smoke.mjs
