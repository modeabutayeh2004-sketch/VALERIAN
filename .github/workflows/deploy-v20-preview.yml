name: Build VALERIAN V20 browser preview
on:
  push:
    branches: [android/apk-v20, work/v20-single-document-integration, work/v20-cleanup-baseline]
    paths:
      - 'index.html'
      - 'engine-runtime.js'
      - 'engine.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'scripts/**'
      - 'styles/tailwind.audit.css'
      - 'tailwind.audit.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-v20-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: valerian-v20-browser-preview
  cancel-in-progress: true
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V20 preview branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web build dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser preview only
        run: npm run build:web
      - name: Generate isolated Tailwind CSS audit output
        run: npm run build:css-audit
      - name: Embed missing Tailwind utilities for offline preview
        run: npm run build:css-completion
      - name: Install headless browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Run real browser visual smoke test
        run: node scripts/visual-smoke.mjs
      - name: Upload visual smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: VALERIAN-V20-Visual-Smoke
          path: |
            ./www/visual-dark.png
            ./www/visual-light.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser preview package
        uses: actions/upload-artifact@v4
        with:
          name: VALERIAN-V20-Browser-Preview
          path: ./www
          if-no-files-found: error
          retention-days: 14
