name: Build VALERIAN V20 browser preview
on:
  push:
    branches: [android/apk-v20]
    paths:
      - 'index.html'
      - 'engine.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-v20-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: valerian-v20-browser-preview
  cancel-in-progress: true
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V20 preview branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web build dependencies
        run: npm ci
      - name: Build browser preview only
        run: npm run build:web
      - name: Upload browser preview package
        uses: actions/upload-artifact@v4
        with:
          name: VALERIAN-V20-Browser-Preview
          path: ./www
          if-no-files-found: error
          retention-days: 14
